name: springboot-redis-workshop

services:
  postgres:
    image: postgres:17
    container_name: springboot-redis-workshop-postgres
    environment:
      POSTGRES_USER: redisworkshop
      POSTGRES_PASSWORD: redisworkshop
      POSTGRES_DB: redis_workshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redisworkshop -d redis_workshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: springboot-redis-workshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
